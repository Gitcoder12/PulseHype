name: One-time emoji cleanup

on:
  push:
    branches:
      - "chore/remove-emoji-glyphs-2026-11-13"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove emoji glyphs from repository text files
        run: python scripts/one_time_emoji_cleanup.py
      - name: Commit cleaned repository text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f -- scripts/one_time_emoji_cleanup.py .github/workflows/one_time_emoji_cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove emoji glyphs from repository text"
          git push origin "HEAD:\${GITHUB_REF_NAME}"
