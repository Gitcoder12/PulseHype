<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseHype v4</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#030305;--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);--border-hover:rgba(232,33,39,0.5);
  --accent:#e82127;--white:#f8f8f8;--text:#e8e8e8;--muted:#7a7a8a;
  --green:#00ff9d;--blue:#3b82f6;--yellow:#fbbf24;--glow:rgba(232,33,39,0.25);
  --card-pad:22px 24px;--card-gap:14px;--fs-base:16px;--fs-title:19px;--fs-hype:22px;
  --blur:12px;
}
[data-theme="light"]{
  --bg:#f0f0f2;--surface:rgba(255,255,255,0.7);--surface2:rgba(255,255,255,0.9);
  --border:rgba(0,0,0,0.08);--border-hover:rgba(232,33,39,0.4);
  --accent:#e82127;--white:#111;--text:#1a1a1a;--muted:#666;
  --green:#16a34a;--blue:#2563eb;--yellow:#ca8a04;--glow:rgba(232,33,39,0.12);
  --blur:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:var(--fs-base);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s;overflow-x:hidden}
body.compact{--card-pad:14px 16px;--card-gap:8px;--fs-title:16px;--fs-hype:18px}

/* Animated mesh background */
.bg-mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 18s ease-in-out infinite}
.orb1{width:500px;height:500px;background:radial-gradient(circle,#e82127,transparent 70%);top:-10%;left:-5%;animation-delay:0s}
.orb2{width:400px;height:400px;background:radial-gradient(circle,#3b82f6,transparent 70%);bottom:-5%;right:-5%;animation-delay:-6s}
.orb3{width:350px;height:350px;background:radial-gradient(circle,#00ff9d,transparent 70%);top:40%;left:50%;animation-delay:-12s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,20px) scale(.95)}}

/* Custom scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#ff3b40}

#progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:9999;transition:width .3s ease;box-shadow:0 0 12px var(--accent)}
.wrap{position:relative;z-index:1}

header{background:rgba(3,3,5,.7);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--border);padding:0 32px;position:sticky;top:0;z-index:100;display:flex;align-items:center;height:60px;gap:20px;transition:background .35s,border-color .35s}
[data-theme="light"] header{background:rgba(240,240,242,.75)}
.logo{display:flex;align-items:center;gap:12px;font-family:Anton,sans-serif;font-size:28px;letter-spacing:1.2px;color:var(--white);text-transform:uppercase}
.logo-mark{width:26px;height:26px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);box-shadow:0 0 16px var(--glow)}
.live{display:flex;align-items:center;gap:7px;font-family:JetBrains Mono,monospace;font-size:12px;color:var(--green);letter-spacing:1px}
.live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(8px);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;transition:all .2s;font-family:Inter,sans-serif;display:flex;align-items:center;gap:6px}
.icon-btn:hover{border-color:var(--accent);color:var(--white);box-shadow:0 0 12px var(--glow)}
.kbd{font-family:JetBrains Mono,monospace;font-size:10px;opacity:.6;margin-left:4px}
.last-update{font-family:JetBrains Mono,monospace;font-size:12px;color:var(--muted);margin-left:10px}

.feeds-bar{background:rgba(3,3,5,.5);backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--border);padding:0 32px;display:flex;overflow-x:auto;transition:background .35s}
[data-theme="light"] .feeds-bar{background:rgba(240,240,242,.6)}
.feeds-bar::-webkit-scrollbar{display:none}
.feed-btn{padding:14px 18px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;font-family:Inter,sans-serif}
.feed-btn:hover{color:var(--text)}
.feed-btn.active{color:var(--white);border-bottom-color:var(--accent)}

.main{max-width:1440px;margin:0 auto;padding:24px 32px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:800px){.charts-row{grid-template-columns:1fr}}
.chart-card{background:var(--surface);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:12px;padding:18px 20px;transition:all .3s}
.chart-title{font-family:Anton,sans-serif;font-size:13px;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.chart-hint{font-family:Inter,sans-serif;font-size:11px;font-weight:400;letter-spacing:0;opacity:.6}
.chart-box{position:relative;height:200px;cursor:pointer}

.controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.sort-btn{padding:8px 16px;background:var(--surface);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:Inter,sans-serif}
.sort-btn:hover{border-color:var(--border-hover);color:var(--text)}
.sort-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 16px var(--glow)}
.filter-tag{padding:6px 12px;background:rgba(232,33,39,.15);border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;display:none}
.filter-tag.show{display:inline-flex;align-items:center;gap:6px}

.content-grid{display:grid;grid-template-columns:1fr 300px;gap:24px}
@media(max-width:1000px){.content-grid{grid-template-columns:1fr}.sidebar{display:none}}

.posts-grid{display:flex;flex-direction:column;gap:var(--card-gap)}
.post-card{background:var(--surface);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:10px;padding:var(--card-pad);text-decoration:none;display:block;transition:border-color .25s,box-shadow .25s;position:relative;opacity:0;transform:translateY(16px);animation:cardIn .45s ease forwards}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.post-card:hover{border-color:var(--accent);box-shadow:0 0 28px var(--glow)}
.post-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .2s;border-radius:10px 0 0 10px}
.post-card:hover::before{opacity:1}
.post-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:JetBrains Mono,monospace;font-size:12px;color:var(--muted)}
.sub-badge{background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:4px;color:var(--text);font-weight:500;font-size:11px}
.post-title{font-size:var(--fs-title);font-weight:600;line-height:1.4;color:var(--white);margin-bottom:12px;letter-spacing:-.2px}
.post-stats{display:flex;align-items:center;gap:16px;font-size:13px}
.stat{display:flex;align-items:center;gap:5px;color:var(--muted);font-family:JetBrains Mono,monospace;font-size:12px}
.stat.hot{color:var(--accent)}
.sentiment{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;font-family:JetBrains Mono,monospace;text-transform:uppercase;letter-spacing:.4px}
.sentiment.positive{background:rgba(0,255,157,.12);color:var(--green)}
.sentiment.negative{background:rgba(232,33,39,.15);color:var(--accent)}
.sentiment.neutral{background:rgba(59,130,246,.12);color:var(--blue)}
.sentiment.mixed{background:rgba(251,191,36,.12);color:var(--yellow)}
.hype-wrap{margin-left:auto;display:flex;align-items:center;gap:10px}
.spark{width:56px;height:20px}
.hype-bar{width:56px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.hype-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.hype-num{font-family:Anton,sans-serif;font-size:var(--fs-hype);color:var(--white);min-width:28px;text-align:right}

.sidebar{display:flex;flex-direction:column;gap:14px}
.side-card{background:var(--surface);backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:12px;padding:16px;transition:all .3s}
.side-title{font-family:Anton,sans-serif;font-size:13px;letter-spacing:1.4px;color:var(--muted);margin-bottom:12px;text-transform:uppercase}
.trend-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.trend-item:last-child{border-bottom:none}
.trend-rank{font-family:Anton,sans-serif;font-size:16px;color:var(--muted);width:22px}
.trend-name{font-size:13px;font-weight:600;flex:1;color:var(--text);line-height:1.3}
.trend-vel{font-family:JetBrains Mono,monospace;font-size:12px;color:var(--green)}

/* Skeleton loaders */
.skeleton{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px 24px;animation:skel 1.4s ease-in-out infinite}
.skel-line{height:14px;background:linear-gradient(90deg,var(--border),var(--surface2),var(--border));background-size:200% 100%;border-radius:4px;margin-bottom:12px;animation:shimmer 1.4s infinite}
.skel-line.short{width:40%}.skel-line.med{width:70%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes skel{0%,100%{opacity:.6}50%{opacity:1}}

.loading,.empty,.error{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
.error{color:var(--accent)}
.retry{margin-top:14px;padding:10px 24px;background:var(--accent);border:none;color:#fff;font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;border-radius:6px}

/* Command Palette */
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);z-index:10000;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
.cmd-overlay.open{display:flex}
.cmd-box{width:min(560px,92vw);background:var(--surface2);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.5);overflow:hidden;animation:cmdIn .2s ease}
@keyframes cmdIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
.cmd-input{width:100%;padding:18px 20px;border:none;background:transparent;color:var(--white);font-size:16px;font-family:Inter,sans-serif;outline:none;border-bottom:1px solid var(--border)}
.cmd-input::placeholder{color:var(--muted)}
.cmd-list{max-height:320px;overflow-y:auto;padding:8px}
.cmd-item{padding:12px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:12px;color:var(--text);font-size:14px;transition:background .12s}
.cmd-item:hover,.cmd-item.active{background:var(--surface);color:var(--white)}
.cmd-item .cmd-key{margin-left:auto;font-family:JetBrains Mono,monospace;font-size:11px;color:var(--muted)}
.cmd-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="bg-mesh"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div id="progress"></div>
<div class="wrap">
<header>
  <div class="logo"><div class="logo-mark"></div>PulseHype</div>
  <div class="live"><div class="live-dot"></div>LIVE</div>
  <div class="hdr-actions">
    <button class="icon-btn" onclick="openCmd()">⌘K <span class="kbd">Ctrl+K</span></button>
    <button class="icon-btn" onclick="toggleTheme()">◐ Theme</button>
    <button class="icon-btn" onclick="toggleDensity()">☰ Density</button>
    <button class="icon-btn" onclick="exportJSON()">↓ JSON</button>
    <button class="icon-btn" onclick="setFont(-1)">A-</button>
    <button class="icon-btn" onclick="setFont(1)">A+</button>
    <span class="last-update" id="lastUpdate">—</span>
  </div>
</header>
<div class="feeds-bar">
  <button class="feed-btn active" data-feed="all" onclick="switchFeed('all',this)">All</button>
  <button class="feed-btn" data-feed="technology" onclick="switchFeed('technology',this)">Tech</button>
  <button class="feed-btn" data-feed="hackernews" onclick="switchFeed('hackernews',this)">HN</button>
  <button class="feed-btn" data-feed="worldnews" onclick="switchFeed('worldnews',this)">World</button>
  <button class="feed-btn" data-feed="gaming" onclick="switchFeed('gaming',this)">Gaming</button>
  <button class="feed-btn" data-feed="science" onclick="switchFeed('science',this)">Science</button>
  <button class="feed-btn" data-feed="movies" onclick="switchFeed('movies',this)">Movies</button>
  <button class="feed-btn" data-feed="funny" onclick="switchFeed('funny',this)">Funny</button>
</div>
<div class="main">
  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Sentiment <span class="chart-hint">click to filter</span></div>
      <div class="chart-box"><canvas id="sentChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Hype Distribution</div>
      <div class="chart-box"><canvas id="hypeChart"></canvas></div>
    </div>
  </div>
  <div class="controls">
    <button class="sort-btn active" onclick="setSort('hype',this)">Hype Score</button>
    <button class="sort-btn" onclick="setSort('hot',this)">Trending</button>
    <button class="sort-btn" onclick="setSort('comments',this)">Discussed</button>
    <button class="sort-btn" onclick="setSort('new',this)">Fresh</button>
    <span class="filter-tag" id="filterTag" onclick="clearFilter()">✕ <span id="filterLabel"></span></span>
  </div>
  <div class="content-grid">
    <div class="posts-grid" id="postsGrid"></div>
    <aside class="sidebar">
      <div class="side-card">
        <div class="side-title">Trending Topics</div>
        <div id="trendingTopics"><div style="color:var(--muted);font-size:13px">Loading…</div></div>
      </div>
    </aside>
  </div>
</div>
</div>

<!-- Command Palette -->
<div class="cmd-overlay" id="cmdOverlay" onclick="if(event.target===this)closeCmd()">
  <div class="cmd-box">
    <input class="cmd-input" id="cmdInput" placeholder="Type a command or search…" autocomplete="off">
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>

<script>
const state={currentFeed:"all",sortMode:"hype",posts:[],loading:false,fontLevel:0,sentimentFilter:null,compact:false};
let sentChart=null,hypeChart=null,cmdIdx=0;

const CMD_ACTIONS=[
  {label:"Feed: All",run:()=>clickFeed("all")},
  {label:"Feed: Tech",run:()=>clickFeed("technology")},
  {label:"Feed: HN",run:()=>clickFeed("hackernews")},
  {label:"Feed: World",run:()=>clickFeed("worldnews")},
  {label:"Feed: Gaming",run:()=>clickFeed("gaming")},
  {label:"Feed: Science",run:()=>clickFeed("science")},
  {label:"Feed: Movies",run:()=>clickFeed("movies")},
  {label:"Feed: Funny",run:()=>clickFeed("funny")},
  {label:"Toggle Theme",run:()=>toggleTheme()},
  {label:"Toggle Density",run:()=>toggleDensity()},
  {label:"Export JSON",run:()=>exportJSON()},
  {label:"Refresh Feed",run:()=>loadFeed(state.currentFeed)},
  {label:"Clear Sentiment Filter",run:()=>clearFilter()},
];

function clickFeed(name){const btn=document.querySelector(`.feed-btn[data-feed="${name}"]`);if(btn)switchFeed(name,btn)}
function openCmd(){document.getElementById("cmdOverlay").classList.add("open");document.getElementById("cmdInput").value="";renderCmd("");document.getElementById("cmdInput").focus();cmdIdx=0}
function closeCmd(){document.getElementById("cmdOverlay").classList.remove("open")}
function renderCmd(q){
  const list=document.getElementById("cmdList");
  const filtered=CMD_ACTIONS.filter(a=>a.label.toLowerCase().includes(q.toLowerCase()));
  if(!filtered.length){list.innerHTML='<div class="cmd-empty">No commands found</div>';return}
  list.innerHTML=filtered.map((a,i)=>`<div class="cmd-item ${i===cmdIdx?"active":""}" data-i="${i}">${a.label}</div>`).join("");
  list.querySelectorAll(".cmd-item").forEach(el=>{el.onclick=()=>{filtered[+el.dataset.i].run();closeCmd()}});
}
document.getElementById("cmdInput").addEventListener("input",e=>{cmdIdx=0;renderCmd(e.target.value)});
document.getElementById("cmdInput").addEventListener("keydown",e=>{
  const items=[...document.querySelectorAll(".cmd-item")];
  if(e.key==="ArrowDown"){e.preventDefault();cmdIdx=Math.min(cmdIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle("active",i===cmdIdx))}
  if(e.key==="ArrowUp"){e.preventDefault();cmdIdx=Math.max(cmdIdx-1,0);items.forEach((el,i)=>el.classList.toggle("active",i===cmdIdx))}
  if(e.key==="Enter"){e.preventDefault();const q=document.getElementById("cmdInput").value;const filtered=CMD_ACTIONS.filter(a=>a.label.toLowerCase().includes(q.toLowerCase()));if(filtered[cmdIdx]){filtered[cmdIdx].run();closeCmd()}}
  if(e.key==="Escape")closeCmd();
});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();openCmd()}});

function setFont(d){state.fontLevel=Math.max(-1,Math.min(2,state.fontLevel+d));const m={[-1]:{b:"14px",t:"16px",h:"18px"},[0]:{b:"16px",t:"19px",h:"22px"},[1]:{b:"17px",t:"21px",h:"24px"},[2]:{b:"18px",t:"23px",h:"26px"}};const s=m[state.fontLevel];document.documentElement.style.setProperty("--fs-base",s.b);document.documentElement.style.setProperty("--fs-title",s.t);document.documentElement.style.setProperty("--fs-hype",s.h)}
function setProgress(p){document.getElementById("progress").style.width=p+"%"}
function toggleTheme(){const h=document.documentElement;h.setAttribute("data-theme",h.getAttribute("data-theme")==="dark"?"light":"dark");if(state.posts.length)updateCharts(state.posts)}
function toggleDensity(){document.body.classList.toggle("compact");state.compact=!state.compact}
function formatNum(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"k";return String(n)}
function timeAgo(utc){const m=Math.floor((Date.now()/1000-utc)/60);if(m<1)return"just now";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d"}
function hypeColor(s){if(s>=75)return"var(--accent)";if(s>=50)return"#ff6b35";if(s>=30)return"var(--yellow)";return"var(--muted)"}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function sparkData(seed){const pts=[];let v=30+(Math.abs(seed)%40);for(let i=0;i<12;i++){v=Math.max(5,Math.min(95,v+(Math.sin(seed+i)*8)+(seed%7)-3));pts.push(Math.round(v))}return pts}
function drawSpark(canvas,data,color){const ctx=canvas.getContext("2d");const w=canvas.width=56;const h=canvas.height=20;ctx.clearRect(0,0,w,h);const min=Math.min(...data),max=Math.max(...data),range=max-min||1;ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.5;data.forEach((v,i)=>{const x=(i/(data.length-1))*w;const y=h-2-((v-min)/range)*(h-4);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke()}

async function fetchFeed(k){const r=await fetch("/api/feed/"+k);if(!r.ok)throw new Error("HTTP "+r.status);return(await r.json()).posts||[]}
function sortPosts(posts){let list=posts.filter(p=>!p.over_18);if(state.sentimentFilter)list=list.filter(p=>(p.sentiment&&p.sentiment.label)===state.sentimentFilter);switch(state.sortMode){case"hype":return[...list].sort((a,b)=>(b.hype||0)-(a.hype||0));case"hot":return[...list].sort((a,b)=>(b.ups||0)-(a.ups||0));case"comments":return[...list].sort((a,b)=>(b.num_comments||0)-(a.num_comments||0));case"new":return[...list].sort((a,b)=>(b.created_utc||0)-(a.created_utc||0));default:return list}}

function updateCharts(posts){
  const counts={positive:0,negative:0,neutral:0,mixed:0};const buckets=[0,0,0,0,0];
  posts.forEach(p=>{const l=(p.sentiment&&p.sentiment.label)||"neutral";if(counts[l]!==undefined)counts[l]++;const h=p.hype||0;if(h<=20)buckets[0]++;else if(h<=40)buckets[1]++;else if(h<=60)buckets[2]++;else if(h<=80)buckets[3]++;else buckets[4]++});
  const isDark=document.documentElement.getAttribute("data-theme")!=="light";
  const tickColor=isDark?"#7a7a8a":"#666";const gridColor=isDark?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.06)";
  if(sentChart)sentChart.destroy();
  sentChart=new Chart(document.getElementById("sentChart"),{type:"doughnut",data:{labels:["Positive","Negative","Neutral","Mixed"],datasets:[{data:[counts.positive,counts.negative,counts.neutral,counts.mixed],backgroundColor:["#00ff9d","#e82127","#3b82f6","#fbbf24"],borderWidth:0,hoverOffset:10}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",animation:{duration:800},plugins:{legend:{position:"bottom",labels:{color:tickColor,font:{size:11},padding:12}},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${ctx.raw} posts`}}},onClick:(e,els)=>{if(!els.length)return;const labels=["positive","negative","neutral","mixed"];const clicked=labels[els[0].index];if(state.sentimentFilter===clicked)clearFilter();else{state.sentimentFilter=clicked;document.getElementById("filterLabel").textContent=clicked;document.getElementById("filterTag").classList.add("show");renderPosts(state.posts)}}}});
  if(hypeChart)hypeChart.destroy();
  hypeChart=new Chart(document.getElementById("hypeChart"),{type:"bar",data:{labels:["0-20","21-40","41-60","61-80","81+"],datasets:[{data:buckets,backgroundColor:"#e82127",borderRadius:5,hoverBackgroundColor:"#ff3b40"}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:800},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw} posts`}}},scales:{x:{ticks:{color:tickColor,font:{size:11}},grid:{color:gridColor}},y:{ticks:{color:tickColor,font:{size:11}},grid:{color:gridColor},beginAtZero:true}}}});
}
function clearFilter(){state.sentimentFilter=null;document.getElementById("filterTag").classList.remove("show");renderPosts(state.posts)}

function showSkeletons(){
  const grid=document.getElementById("postsGrid");
  grid.innerHTML=Array(6).fill(0).map(()=>`<div class="skeleton"><div class="skel-line short"></div><div class="skel-line"></div><div class="skel-line med"></div></div>`).join("");
}

function renderPosts(posts){
  const grid=document.getElementById("postsGrid");
  if(!posts||!posts.length){grid.innerHTML="<div class=empty>No posts found.</div>";return}
  const sorted=sortPosts(posts);
  if(!sorted.length){grid.innerHTML="<div class=empty>No posts match this filter.</div>";return}
  grid.innerHTML=sorted.slice(0,40).map((p,idx)=>{
    const h=p.hype||0,s=p.sentiment||{label:"neutral",icon:"●"},c=hypeColor(h);
    const badge=p.subreddit==="hackernews"?"HN":(p.subreddit||"news");
    const delay=(idx*0.04).toFixed(2);
    return `<a class="post-card" href="${p.url||p.permalink||"#"}" target="_blank" rel="noopener" data-tilt data-tilt-max="5" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.1" style="animation-delay:${delay}s">
      <div class="post-meta"><span class="sub-badge">${badge}</span><span>${timeAgo(p.created_utc)}</span></div>
      <div class="post-title">${escapeHtml(p.title||"")}</div>
      <div class="post-stats">
        <div class="stat ${h>=60?"hot":""}">▲ ${formatNum(p.ups)}</div>
        <div class="stat">💬 ${formatNum(p.num_comments)}</div>
        <div class="sentiment ${s.label}">${s.icon||"●"} ${s.label}</div>
        <div class="hype-wrap">
          <canvas class="spark" id="sp${idx}"></canvas>
          <div class="hype-bar"><div class="hype-fill" style="width:${h}%;background:${c}"></div></div>
          <div class="hype-num" style="color:${c}">${h}</div>
        </div>
      </div></a>`;
  }).join("");
  sorted.slice(0,40).forEach((p,idx)=>{const canvas=document.getElementById("sp"+idx);if(canvas){const seed=(p.id||"").split("").reduce((a,ch)=>a+ch.charCodeAt(0),0)+idx;drawSpark(canvas,sparkData(seed),hypeColor(p.hype||0))}});
  // Init tilt
  if(window.VanillaTilt){VanillaTilt.init(document.querySelectorAll("[data-tilt]"),{max:5,speed:400,glare:true,"max-glare":0.08})}
  updateCharts(posts);
}

function exportJSON(){const data=sortPosts(state.posts);const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`pulsehype-${state.currentFeed}-${Date.now()}.json`;a.click()}

async function loadFeed(k){
  state.loading=true;setProgress(20);showSkeletons();
  try{setProgress(50);const posts=await fetchFeed(k);setProgress(85);state.posts=posts;renderPosts(posts);document.getElementById("lastUpdate").textContent="Updated "+new Date().toLocaleTimeString();setProgress(100);setTimeout(()=>setProgress(0),350)}
  catch(e){console.error(e);setProgress(0);document.getElementById("postsGrid").innerHTML="<div class=error>Signal lost.<br><button class=retry onclick=loadFeed(state.currentFeed)>Retry</button></div>"}
  state.loading=false;
}
function switchFeed(k,btn){state.currentFeed=k;state.sentimentFilter=null;document.getElementById("filterTag").classList.remove("show");document.querySelectorAll(".feed-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");loadFeed(k)}
function setSort(m,btn){state.sortMode=m;document.querySelectorAll(".sort-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderPosts(state.posts)}
async function loadTrending(){try{const r=await fetch("/api/trending");const d=await r.json();const posts=(d.posts||[]).slice(0,7);document.getElementById("trendingTopics").innerHTML=posts.map((p,i)=>`<div class="trend-item"><div class="trend-rank">${i+1}</div><div class="trend-name">${escapeHtml((p.title||"").slice(0,40))}${((p.title||"").length>40?"…":"")}</div><div class="trend-vel">${p.hype||0}</div></div>`).join("")||"<div style=color:var(--muted)>No data</div>"}catch(e){document.getElementById("trendingTopics").innerHTML="<div style=color:var(--muted)>—</div>"}}

loadFeed("all");loadTrending();
setInterval(()=>{loadFeed(state.currentFeed);loadTrending()},90000);
</script>
</body>
</html>
