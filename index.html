<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseHype</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--surface:#0a0a0a;--surface2:#111;--border:#1c1c1c;
  --accent:#e82127;--white:#fff;--text:#f5f5f5;--muted:#8a8a8a;
  --green:#00ff9d;--blue:#3b82f6;--yellow:#fbbf24;
  --fs-base:16px;--fs-title:20px;--fs-hype:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:var(--fs-base);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}

/* Progress bar at very top */
#progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:999;transition:width .35s ease;box-shadow:0 0 8px var(--accent)}

header{background:var(--bg);border-bottom:1px solid var(--border);padding:0 36px;position:sticky;top:0;z-index:100;display:flex;align-items:center;height:68px;gap:28px}
.logo{display:flex;align-items:center;gap:14px;font-family:Anton,sans-serif;font-size:32px;letter-spacing:1.5px;color:var(--white);text-transform:uppercase}
.logo-mark{width:30px;height:30px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.live{display:flex;align-items:center;gap:8px;font-family:JetBrains Mono,monospace;font-size:13px;color:var(--green);letter-spacing:1px}
.live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.last-update{margin-left:auto;font-family:JetBrains Mono,monospace;font-size:13px;color:var(--muted)}

/* Font size controls */
.font-ctrl{display:flex;gap:6px;margin-left:20px}
.font-btn{width:28px;height:28px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;border-radius:4px;transition:all .15s}
.font-btn:hover{border-color:var(--accent);color:var(--white)}

.feeds-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 36px;display:flex;overflow-x:auto}
.feeds-bar::-webkit-scrollbar{display:none}
.feed-btn{padding:16px 22px;border:none;background:none;color:var(--muted);font-family:Inter,sans-serif;font-size:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.feed-btn:hover{color:var(--text)}
.feed-btn.active{color:var(--white);border-bottom-color:var(--accent)}

.main{max-width:1320px;margin:0 auto;padding:32px 36px;display:grid;grid-template-columns:1fr 320px;gap:36px}
@media(max-width:1000px){.main{grid-template-columns:1fr}.sidebar{display:none}}

.controls{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;align-items:center}
.sort-btn{padding:9px 18px;background:transparent;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;transition:all .15s;font-family:Inter,sans-serif}
.sort-btn:hover{border-color:#2a2a2a;color:var(--text)}
.sort-btn.active{background:var(--accent);border-color:var(--accent);color:var(--white)}

.posts-grid{display:flex;flex-direction:column;gap:14px}
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px 26px;text-decoration:none;display:block;transition:border-color .18s,background .18s,transform .18s;position:relative}
.post-card:hover{border-color:#2a2a2a;background:var(--surface2);transform:translateY(-1px)}
.post-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .18s}
.post-card:hover::before{opacity:1}

.post-meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-family:JetBrains Mono,monospace;font-size:13px;color:var(--muted)}
.sub-badge{background:var(--surface2);border:1px solid var(--border);padding:3px 10px;border-radius:3px;color:var(--text);font-weight:500;font-size:12px}
.post-title{font-size:var(--fs-title);font-weight:600;line-height:1.45;color:var(--white);margin-bottom:16px;letter-spacing:-.3px}
.post-stats{display:flex;align-items:center;gap:20px;font-size:14px}
.stat{display:flex;align-items:center;gap:6px;color:var(--muted);font-family:JetBrains Mono,monospace;font-size:13px}
.stat.hot{color:var(--accent)}
.sentiment{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:3px;font-size:11px;font-weight:600;font-family:JetBrains Mono,monospace;text-transform:uppercase;letter-spacing:.5px}
.sentiment.positive{background:rgba(0,255,157,.12);color:var(--green)}
.sentiment.negative{background:rgba(232,33,39,.15);color:var(--accent)}
.sentiment.neutral{background:rgba(59,130,246,.12);color:var(--blue)}
.sentiment.mixed{background:rgba(251,191,36,.12);color:var(--yellow)}

.hype-wrap{margin-left:auto;display:flex;align-items:center;gap:12px}
.hype-bar{width:72px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.hype-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s ease}
.hype-num{font-family:Anton,sans-serif;font-size:var(--fs-hype);color:var(--white);min-width:32px;text-align:right;letter-spacing:.5px}

.sidebar{display:flex;flex-direction:column;gap:18px}
.side-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px}
.side-title{font-family:Anton,sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--muted);margin-bottom:16px;text-transform:uppercase}
.trend-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.trend-item:last-child{border-bottom:none}
.trend-rank{font-family:Anton,sans-serif;font-size:20px;color:var(--muted);width:26px}
.trend-name{font-size:14px;font-weight:600;flex:1;color:var(--text);line-height:1.35}
.trend-vel{font-family:JetBrains Mono,monospace;font-size:13px;color:var(--green)}

.loading,.empty,.error{text-align:center;padding:90px 20px;color:var(--muted);font-size:16px}
.spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:var(--accent)}
.retry{margin-top:18px;padding:12px 28px;background:var(--accent);border:none;color:white;font-weight:600;font-size:14px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border-radius:3px}
</style>
</head>
<body>
<div id="progress"></div>
<header>
  <div class="logo"><div class="logo-mark"></div>PulseHype</div>
  <div class="live"><div class="live-dot"></div>LIVE</div>
  <div class="font-ctrl">
    <button class="font-btn" onclick="setFont(-1)" title="Smaller">A-</button>
    <button class="font-btn" onclick="setFont(1)" title="Larger">A+</button>
  </div>
  <div class="last-update" id="lastUpdate">—</div>
</header>
<div class="feeds-bar">
  <button class="feed-btn active" data-feed="all" onclick="switchFeed('all',this)">All</button>
  <button class="feed-btn" data-feed="technology" onclick="switchFeed('technology',this)">Tech</button>
  <button class="feed-btn" data-feed="hackernews" onclick="switchFeed('hackernews',this)">HN</button>
  <button class="feed-btn" data-feed="worldnews" onclick="switchFeed('worldnews',this)">World</button>
  <button class="feed-btn" data-feed="gaming" onclick="switchFeed('gaming',this)">Gaming</button>
  <button class="feed-btn" data-feed="science" onclick="switchFeed('science',this)">Science</button>
  <button class="feed-btn" data-feed="movies" onclick="switchFeed('movies',this)">Movies</button>
  <button class="feed-btn" data-feed="funny" onclick="switchFeed('funny',this)">Funny</button>
</div>
<div class="main">
  <div>
    <div class="controls">
      <button class="sort-btn active" onclick="setSort('hype',this)">Hype Score</button>
      <button class="sort-btn" onclick="setSort('hot',this)">Trending</button>
      <button class="sort-btn" onclick="setSort('comments',this)">Discussed</button>
      <button class="sort-btn" onclick="setSort('new',this)">Fresh</button>
    </div>
    <div class="posts-grid" id="postsGrid"><div class="loading"><div class="spinner"></div>Scanning signal…</div></div>
  </div>
  <aside class="sidebar">
    <div class="side-card"><div class="side-title">Trending Topics</div><div id="trendingTopics"><div style="color:var(--muted);font-size:14px">Loading…</div></div></div>
    <div class="side-card"><div class="side-title">Sentiment</div><div id="sentimentBreakdown" style="font-size:14px;line-height:1.9"></div></div>
  </aside>
</div>
<script>
const state={currentFeed:"all",sortMode:"hype",posts:[],loading:false,fontLevel:0};
function setFont(delta){
  state.fontLevel=Math.max(-1,Math.min(2,state.fontLevel+delta));
  const map={[-1]:{base:"14px",title:"17px",hype:"20px"},[0]:{base:"16px",title:"20px",hype:"24px"},[1]:{base:"17px",title:"22px",hype:"26px"},[2]:{base:"18px",title:"24px",hype:"28px"}};
  const s=map[state.fontLevel];
  document.documentElement.style.setProperty("--fs-base",s.base);
  document.documentElement.style.setProperty("--fs-title",s.title);
  document.documentElement.style.setProperty("--fs-hype",s.hype);
}
function setProgress(pct){document.getElementById("progress").style.width=pct+"%"}
function formatNum(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"k";return String(n)}
function timeAgo(utc){const m=Math.floor((Date.now()/1000-utc)/60);if(m<1)return"just now";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d"}
function hypeColor(s){if(s>=75)return"var(--accent)";if(s>=50)return"#ff6b35";if(s>=30)return"var(--yellow)";return"var(--muted)"}
async function fetchFeed(k){const r=await fetch("/api/feed/"+k);if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();return d.posts||[]}
function sortPosts(posts){let list=posts.filter(p=>!p.over_18);switch(state.sortMode){case"hype":return[...list].sort((a,b)=>(b.hype||0)-(a.hype||0));case"hot":return[...list].sort((a,b)=>(b.ups||0)-(a.ups||0));case"comments":return[...list].sort((a,b)=>(b.num_comments||0)-(a.num_comments||0));case"new":return[...list].sort((a,b)=>(b.created_utc||0)-(a.created_utc||0));default:return list}}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function renderPosts(posts){
  const grid=document.getElementById("postsGrid");
  if(!posts||!posts.length){grid.innerHTML="<div class=empty>No posts found. Try a different feed.</div>";return}
  const sorted=sortPosts(posts);
  grid.innerHTML=sorted.slice(0,40).map(p=>{
    const h=p.hype||0,s=p.sentiment||{label:"neutral",icon:"●"},c=hypeColor(h);
    const badge=p.subreddit==="hackernews"?"HN":(p.subreddit||"news");
    return `<a class="post-card" href="${p.url||p.permalink||"#"}" target="_blank" rel="noopener">
      <div class="post-meta"><span class="sub-badge">${badge}</span><span>${timeAgo(p.created_utc)}</span></div>
      <div class="post-title">${escapeHtml(p.title||"")}</div>
      <div class="post-stats">
        <div class="stat ${h>=60?"hot":""}">▲ ${formatNum(p.ups)}</div>
        <div class="stat">💬 ${formatNum(p.num_comments)}</div>
        <div class="sentiment ${s.label}">${s.icon||"●"} ${s.label}</div>
        <div class="hype-wrap"><div class="hype-bar"><div class="hype-fill" style="width:${h}%;background:${c}"></div></div>
        <div class="hype-num" style="color:${c}">${h}</div></div>
      </div></a>`;
  }).join("");
  const counts={positive:0,negative:0,neutral:0,mixed:0};
  posts.forEach(p=>{const l=(p.sentiment&&p.sentiment.label)||"neutral";if(counts[l]!==undefined)counts[l]++});
  const total=posts.length||1;
  document.getElementById("sentimentBreakdown").innerHTML=Object.entries(counts)
    .map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="text-transform:capitalize;color:var(--muted)">${k}</span><span style="font-family:JetBrains Mono,monospace">${Math.round(v/total*100)}%</span></div>`).join("");
}
async function loadFeed(k){
  state.loading=true;setProgress(15);
  document.getElementById("postsGrid").innerHTML="<div class=loading><div class=spinner></div>Scanning signal…</div>";
  try{
    setProgress(45);
    const posts=await fetchFeed(k);
    setProgress(85);
    state.posts=posts;renderPosts(posts);
    document.getElementById("lastUpdate").textContent="Updated "+new Date().toLocaleTimeString();
    setProgress(100);setTimeout(()=>setProgress(0),400);
  }catch(e){
    console.error(e);setProgress(0);
    document.getElementById("postsGrid").innerHTML="<div class=error>Signal lost. Backend may be offline.<br><button class=retry onclick=loadFeed(state.currentFeed)>Retry</button></div>";
  }
  state.loading=false;
}
function switchFeed(k,btn){state.currentFeed=k;document.querySelectorAll(".feed-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");loadFeed(k)}
function setSort(m,btn){state.sortMode=m;document.querySelectorAll(".sort-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderPosts(state.posts)}
async function loadTrending(){
  try{
    const r=await fetch("/api/trending");const d=await r.json();
    const posts=(d.posts||[]).slice(0,8);
    document.getElementById("trendingTopics").innerHTML=posts.map((p,i)=>
      `<div class="trend-item"><div class="trend-rank">${i+1}</div><div class="trend-name">${escapeHtml((p.title||"").slice(0,48))}${((p.title||"").length>48?"…":"")}</div><div class="trend-vel">${p.hype||0}</div></div>`
    ).join("")||"<div style=color:var(--muted)>No data</div>";
  }catch(e){document.getElementById("trendingTopics").innerHTML="<div style=color:var(--muted)>—</div>"}
}
loadFeed("all");loadTrending();
setInterval(()=>{loadFeed(state.currentFeed);loadTrending()},90000);
</script>
</body>
</html>
