<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseHype</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--surface:#0a0a0a;--surface2:#111;--border:#1c1c1c;--accent:#e82127;--white:#fff;--text:#f5f5f5;--muted:#8a8a8a;--green:#00ff9d;--blue:#3b82f6;--yellow:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
header{background:var(--bg);border-bottom:1px solid var(--border);padding:0 32px;position:sticky;top:0;z-index:100;display:flex;align-items:center;height:64px;gap:28px}
.logo{display:flex;align-items:center;gap:12px;font-family:Anton,sans-serif;font-size:30px;letter-spacing:1px;color:var(--white);text-transform:uppercase}
.logo-mark{width:28px;height:28px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.live{display:flex;align-items:center;gap:8px;font-family:JetBrains Mono,monospace;font-size:13px;color:var(--green);letter-spacing:1px}
.live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.last-update{margin-left:auto;font-family:JetBrains Mono,monospace;font-size:13px;color:var(--muted)}
.feeds-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 32px;display:flex;overflow-x:auto}
.feeds-bar::-webkit-scrollbar{display:none}
.feed-btn{padding:15px 22px;border:none;background:none;color:var(--muted);font-family:Inter,sans-serif;font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.feed-btn:hover{color:var(--text)}
.feed-btn.active{color:var(--white);border-bottom-color:var(--accent)}
.main{max-width:1280px;margin:0 auto;padding:28px 32px;display:grid;grid-template-columns:1fr 300px;gap:32px}
@media(max-width:960px){.main{grid-template-columns:1fr}.sidebar{display:none}}
.controls{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.sort-btn{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;transition:all .15s;font-family:Inter,sans-serif}
.sort-btn:hover{border-color:#2a2a2a;color:var(--text)}
.sort-btn.active{background:var(--accent);border-color:var(--accent);color:var(--white)}
.nsfw-toggle{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.toggle{width:36px;height:20px;background:var(--border);border-radius:10px;position:relative;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;width:14px;height:14px;background:white;border-radius:50%;top:3px;left:3px;transition:left .2s}
.toggle.on::after{left:19px}
.posts-grid{display:flex;flex-direction:column;gap:12px}
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:22px 24px;text-decoration:none;display:block;transition:border-color .15s,background .15s;position:relative}
.post-card:hover{border-color:#2a2a2a;background:var(--surface2)}
.post-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .15s}
.post-card:hover::before{opacity:1}
.post-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:JetBrains Mono,monospace;font-size:13px;color:var(--muted)}
.sub-badge{background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:2px;color:var(--text);font-weight:500}
.post-title{font-size:19px;font-weight:600;line-height:1.45;color:var(--white);margin-bottom:14px;letter-spacing:-.2px}
.post-stats{display:flex;align-items:center;gap:18px;font-size:13px}
.stat{display:flex;align-items:center;gap:5px;color:var(--muted);font-family:JetBrains Mono,monospace;font-size:13px}
.stat.hot{color:var(--accent)}
.sentiment{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:2px;font-size:10px;font-weight:600;font-family:JetBrains Mono,monospace;text-transform:uppercase;letter-spacing:.5px}
.sentiment.positive{background:rgba(0,255,157,.12);color:var(--green)}
.sentiment.negative{background:rgba(232,33,39,.15);color:var(--accent)}
.sentiment.neutral{background:rgba(59,130,246,.12);color:var(--blue)}
.sentiment.mixed{background:rgba(251,191,36,.12);color:var(--yellow)}
.hype-wrap{margin-left:auto;display:flex;align-items:center;gap:10px}
.hype-bar{width:64px;height:3px;background:var(--border);border-radius:1px;overflow:hidden}
.hype-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .4s ease}
.hype-num{font-family:Anton,sans-serif;font-size:22px;color:var(--white);min-width:28px;text-align:right;letter-spacing:.5px}
.sidebar{display:flex;flex-direction:column;gap:16px}
.side-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:18px}
.side-title{font-family:Anton,sans-serif;font-size:14px;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;text-transform:uppercase}
.trend-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.trend-item:last-child{border-bottom:none}
.trend-rank{font-family:Anton,sans-serif;font-size:18px;color:var(--muted);width:24px}
.trend-name{font-size:14px;font-weight:600;flex:1;color:var(--text)}
.trend-vel{font-family:JetBrains Mono,monospace;font-size:11px;color:var(--green)}
.loading,.empty,.error{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:var(--accent)}
.retry{margin-top:16px;padding:10px 24px;background:var(--accent);border:none;color:white;font-weight:600;font-size:13px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border-radius:2px}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-mark"></div>PulseHype</div>
  <div class="live"><div class="live-dot"></div>LIVE</div>
  <div class="last-update" id="lastUpdate">—</div>
</header>
<div class="feeds-bar">
  <button class="feed-btn active" data-feed="all" onclick="switchFeed('all',this)">All</button>
  <button class="feed-btn" data-feed="technology" onclick="switchFeed('technology',this)">Tech</button>
  <button class="feed-btn" data-feed="hackernews" onclick="switchFeed('hackernews',this)">HN</button>
  <button class="feed-btn" data-feed="worldnews" onclick="switchFeed('worldnews',this)">World</button>
  <button class="feed-btn" data-feed="gaming" onclick="switchFeed('gaming',this)">Gaming</button>
  <button class="feed-btn" data-feed="science" onclick="switchFeed('science',this)">Science</button>
  <button class="feed-btn" data-feed="movies" onclick="switchFeed('movies',this)">Movies</button>
  <button class="feed-btn" data-feed="funny" onclick="switchFeed('funny',this)">Funny</button>
</div>
<div class="main">
  <div>
    <div class="controls">
      <button class="sort-btn active" onclick="setSort('hype',this)">Hype Score</button>
      <button class="sort-btn" onclick="setSort('hot',this)">Trending</button>
      <button class="sort-btn" onclick="setSort('comments',this)">Discussed</button>
      <button class="sort-btn" onclick="setSort('new',this)">Fresh</button>
      
    </div>
    <div class="posts-grid" id="postsGrid"><div class="loading"><div class="spinner"></div>Scanning signal…</div></div>
  </div>
  <aside class="sidebar">
    <div class="side-card"><div class="side-title">Trending Topics</div><div id="trendingTopics"><div style="color:var(--muted);font-size:13px">Loading…</div></div></div>
    <div class="side-card"><div class="side-title">Sentiment</div><div id="sentimentBreakdown" style="font-size:13px;line-height:1.8"></div></div>
  </aside>
</div>
<script>
const state={currentFeed:"all",sortMode:"hype",posts:[],loading:false};
function formatNum(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"k";return String(n)}
function timeAgo(utc){const m=Math.floor((Date.now()/1000-utc)/60);if(m<1)return"just now";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d"}
function hypeColor(s){if(s>=75)return"var(--accent)";if(s>=50)return"#ff6b35";if(s>=30)return"var(--yellow)";return"var(--muted)"}
async function fetchFeed(k){const r=await fetch("/api/feed/"+k);if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();return d.posts||[]}
function sortPosts(posts){let list=posts.filter(p=>!p.over_18);switch(state.sortMode){case"hype":return[...list].sort((a,b)=>(b.hype||0)-(a.hype||0));case"hot":return[...list].sort((a,b)=>(b.ups||0)-(a.ups||0));case"comments":return[...list].sort((a,b)=>(b.num_comments||0)-(a.num_comments||0));case"new":return[...list].sort((a,b)=>(b.created_utc||0)-(a.created_utc||0));default:return list}}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function renderPosts(posts){const grid=document.getElementById("postsGrid");if(!posts||!posts.length){grid.innerHTML="<div class=empty>No posts found. Try a different feed.</div>";return}const sorted=sortPosts(posts);grid.innerHTML=sorted.slice(0,40).map(p=>{const h=p.hype||0,s=p.sentiment||{label:"neutral",icon:"●"},c=hypeColor(h);return`<a class="post-card" href="https://reddit.com${p.permalink||""}" target="_blank" rel="noopener"><div class="post-meta"><span class="sub-badge">r/${p.subreddit||""}</span><span>${timeAgo(p.created_utc)}</span>${p.over_18?"<span style=color:var(--accent)>NSFW</span>":""}</div><div class="post-title">${escapeHtml(p.title||"")}</div><div class="post-stats"><div class="stat ${h>=60?"hot":""}">▲ ${formatNum(p.ups)}</div><div class="stat">💬 ${formatNum(p.num_comments)}</div><div class="sentiment ${s.label}">${s.icon||"●"} ${s.label}</div><div class="hype-wrap"><div class="hype-bar"><div class="hype-fill" style="width:${h}%;background:${c}"></div></div><div class="hype-num" style="color:${c}">${h}</div></div></div></a>`}).join("");const counts={positive:0,negative:0,neutral:0,mixed:0};posts.forEach(p=>{const l=(p.sentiment&&p.sentiment.label)||"neutral";if(counts[l]!==undefined)counts[l]++});const total=posts.length||1;document.getElementById("sentimentBreakdown").innerHTML=Object.entries(counts).map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="text-transform:capitalize;color:var(--muted)">${k}</span><span style="font-family:JetBrains Mono,monospace">${Math.round(v/total*100)}%</span></div>`).join("")}
async function loadFeed(k){state.loading=true;document.getElementById("postsGrid").innerHTML="<div class=loading><div class=spinner></div>Scanning signal…</div>";try{const posts=await fetchFeed(k);state.posts=posts;renderPosts(posts);document.getElementById("lastUpdate").textContent="Updated "+new Date().toLocaleTimeString()}catch(e){console.error(e);document.getElementById("postsGrid").innerHTML="<div class=error>Signal lost. Backend may be offline.<br><button class=retry onclick=loadFeed(state.currentFeed)>Retry</button></div>"}state.loading=false}
function switchFeed(k,btn){state.currentFeed=k;document.querySelectorAll(".feed-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");loadFeed(k)}
function setSort(m,btn){state.sortMode=m;document.querySelectorAll(".sort-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderPosts(state.posts)}

async function loadTrending(){try{const r=await fetch("/api/trending");const d=await r.json();const posts=(d.posts||[]).slice(0,8);document.getElementById("trendingTopics").innerHTML=posts.map((p,i)=>`<div class="trend-item"><div class="trend-rank">${i+1}</div><div class="trend-name">${escapeHtml((p.title||"").slice(0,42))}${((p.title||"").length>42?"…":"")}</div><div class="trend-vel">${p.hype||0}</div></div>`).join("")||"<div style=color:var(--muted)>No data</div>"}catch(e){document.getElementById("trendingTopics").innerHTML="<div style=color:var(--muted)>—</div>"}}
loadFeed("all");loadTrending();setInterval(()=>{loadFeed(state.currentFeed);loadTrending()},60000);
</script>
</body>
</html>
